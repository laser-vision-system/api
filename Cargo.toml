[package]
name = "server-edge-datatypes"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1" , features = [
	"derive"
] }

[lints.rust]
unsafe_code = "deny" # We should avoid using unsafe code as much as possible.

[lints.rustdoc]
missing_crate_level_docs = "warn"
broken_intra_doc_links = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1} # This should be upgraded to forbid in the future.
# Lints from the pedantic group:
missing_errors_doc = "allow" # Consider upgrading in the future.
missing_panics_doc = "allow" # Consider upgrading in the future.
must_use_candidate = "allow" # We don't need to be constantly alerted to this.

# Lints from the restriction group:
absolute_paths = "allow" # Acceptable, maybe this would change.
allow_attributes = "warn" # Encourage the use of `#[except]`.
allow_attributes_without_reason = "deny" # Explain why something is allowed.
arithmetic_side_effects = "allow" # TODO: Upgrade in future?
as_pointer_underscore = "forbid" # Be explicit with pointers.
as_underscore = "allow" # Consider upgrading.
assertions_on_result_states = "warn" # Please mark when you intend to do this.
big_endian_bytes = "deny" # You should not be doing this.
cfg_not_test = "deny" # Anti-pattern.
clone_on_ref_ptr = "allow" # Okay as long as you are aware.
create_dir = "deny" # Use may cause errors.
dbg_macro = "deny" # This should not be committed.
decimal_literal_representation = "warn" # May help readability.
default_numeric_fallback = "deny" # Numeric types should be explicit or immediately obvious.
deref_by_slicing = "deny" # Avoid slicing unecessarily.
doc_include_without_cfg = "forbid" # Only ever include docs with the correct cfg.
doc_paragraphs_missing_punctuation = "warn" # Good punctuation is good.
else_if_without_else = "warn" # Verify that this is what you intended.
empty_drop = "deny" # Almost definitely not what you want.
empty_enum_variants_with_brackets = "deny" # Hurts readability.
empty_structs_with_brackets = "warn" # Helps readability, but could be a breaking change in some scenarios.
error_impl_error = "forbid" # Only causes headaches.
exhaustive_enums = "allow" # TODO: Check if this is only for public enums.
exhaustive_structs = "allow" # TODO: Check if this is only for public enums.
exit = "forbid" # This will almost definitely break something.
expect_used = "warn" # Expect should be used as sparingly as possible.
field_scoped_visibility_modifiers = "forbid" # Headache inducing.
filetype_is_file = "warn" # Encourage using `!is_dir()` instead.
float_cmp_const = "deny" # Comparing floats directly can lead to subtle errors.
fn_to_numeric_cast_any = "forbid" # You definitely do not need to do this.
get_unwrap = "forbid" # This is just a worse version of index access (`[]`).
host_endian_bytes = "deny" # You should not be doing this.
if_then_some_else_none = "warn" # Encourages a simpler pattern.
impl_trait_in_params = "deny" # `impl Trait` prevents turbofish (`::<>`) and may hurt readability.
implicit_return = "allow" # You are encouraged to omit `return`.
indexing_slicing = "deny" # Can cause a panic when used.
infinite_loop = "deny" # Require an explicit return type for this.
inline_asm_x86_att_syntax = "forbid" # No ASM.
inline_asm_x86_intel_syntax = "forbid" # No ASM.
inline_modules = "deny" # Non-test inline modules must explicitly justify why they exist.
inline_trait_bounds = "deny" # Enforcing a consistent style.
integer_division = "deny" # Force a justification for why this is done.
iter_over_hash_type = "allow" # We do not care about order.
large_include_file = "deny" # You should not be doing this.
let_underscore_must_use = "warn" # Do not discard these types. # TODO: Upgrade in the future.
let_underscore_untyped = "warn" # Encourage being explicit.
little_endian_bytes = "deny" # You should not be doing this.
lossy_float_literal = "warn" # Alerts to potential issues.
map_err_ignore = "warn" # Will cause a loss of error details. # TODO: Upgrade in the future.
map_with_unused_argument_over_ranges = "warn" # Encourages a better pattern.
mem_forget = "forbid" # Don't do this.
min_ident_chars = "warn" # Encourage readability.
missing_assert_message = "warn" # Encourage helpful assertion messages.
missing_asserts_for_indexing = "warn" # Encourage checking bounds.
missing_docs_in_private_items = "allow" # TODO: Upgrade in the future.
missing_inline_in_public_items = "allow" # TODO: Maybe upgrade in the future for performance.
mixed_read_write_in_expression = "deny" # Massively hurts clarity.
mod_module_files = "forbid" # Enforce a single styling.
module_name_repetitions = "deny" # Require explicit justification.
multiple_inherent_impl = "allow" # This is fine in a single file, but discouraged across different files.
mutex_atomic = "warn" # Raise attention to a potential alternative.
mutex_integer = "warn" # Raise attention to a potential alternative.
needless_raw_strings = "deny" # Enforce a justification.
non_zero_suggestions = "deny" # Enforce a justification.
panic = "deny" # We should avoid this at all costs.
panic_in_result_fn = "forbid" # If a panic must be used, it should be very explicit.
partial_pub_fields = "deny" # Enforce a justification.
pathbuf_init_then_push = "forbid" # Poor programming.
pattern_type_mismatch = "allow" # Encourages good ownership understanding, but annoying.
pointer_format = "forbid" # You should not be doing this.
print_stderr = "deny" # Only a dedicated logging module should be printing.
print_stdout = "deny" # Only a dedicated logging module should be printing.
pub_without_shorthand = "deny" # Avoid using `pub(in ...)`
rc_buffer = "deny" # Enforce a justification.
rc_mutex = "deny" # Enforce a justification.
redundant_test_prefix = "forbid" # Needless fluff.
redundant_type_annotations = "deny" # Enforce a justification.
rest_pat_in_fully_bound_structs = "deny" # This should only be done when you know the fields will be expanded.
return_and_then = "warn" # Improves readability.
same_name_method = "deny" # Prevents potential confusion.
#separated_literal_suffix = "allow" # Encourages readability.
single_char_lifetime_names = "allow" # Maybe upgrade this?
str_to_string = "warn" # Encourages clarity.
string_add = "warn" # Discourage non-idiomatic code.
string_lit_chars_any = "warn" # Promote a more performant alternative.
string_slice = "deny" # UTF-8 characters span multiple bytes, using slice will likely cause errors.
tests_outside_test_module = "forbid" # Always put tests in the test module.
todo = "forbid" # Should never make it to the remote repository.
try_err = "deny" # Prevent anti-pattern.
unimplemented = "forbid" # Should never make it to the remote repository.
unnecessary_safety_comment = "deny" # Incorrect and confusing.
unnecessary_safety_doc = "deny" # Incorrect and confusing.
unnecessary_self_imports = "deny" # Enforce a justification.
unneeded_field_pattern = "deny" # Enforce a justification.
unreachable = "deny" # Enforce a justification.
unseparated_literal_suffix = "warn" # Encourages readability.
unused_result_ok = "deny" # Prevents silencing potential errors.
unused_trait_names = "warn" # Encourages a better coding practice.
unwrap_in_result = "deny" # Enforce a justification. # TODO: Upgrade in the future.
unwrap_used = "deny" # Enforce a justification. #TODO: Upgrade in the future.
use_debug = "warn" # Discourage this use.
verbose_file_reads = "deny" # Inferior to `fs::read`.
